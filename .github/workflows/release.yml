name: Create New Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Select Latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
          echo "Available iOS SDKs:"
          xcodebuild -showsdks | grep iphoneos

      - name: Clean Build Environment
        run: |
          make clean || true
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/com.apple.dt.Xcode

      - name: Compile Portal
        run: |
          agvtool new-version -all "$(git rev-list --count HEAD)"
          make
          mkdir -p upload
          mv packages/* upload/

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/*.app/Info.plist)
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail

          TAG="v${VERSION}"
          TITLE="Portal v${VERSION}"
          NOTES_FILE="$(mktemp)"

          cat > "$NOTES_FILE" <<EOF
          Latest stable release to download

          Full Changelog: https://github.com/${{ github.repository }}/commits/${TAG}
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating it..."
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"

            gh release upload "$TAG" upload/*ipa --clobber
          else
            echo "Release $TAG does not exist, creating it..."
            gh release create "$TAG" upload/*ipa \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --draft
          fi
